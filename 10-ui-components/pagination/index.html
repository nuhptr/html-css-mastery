<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pagination Component</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>

    <body>
        <nav class="back-bar" aria-label="Breadcrumb">
            <a href="../../index.html">&larr; Back to Curriculum Hub</a>
        </nav>

        <main class="page">
            <p class="status-text" id="page-status" aria-live="polite">Showing page 3 of 23</p>

            <nav class="pagination" aria-label="Pagination">
                <button type="button" class="btn" id="prev-page" aria-label="Previous page">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="btn-icon"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                        aria-hidden="true">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                </button>

                <a href="#page-1" class="page-link" data-page="1">1</a>
                <a href="#page-2" class="page-link" data-page="2">2</a>
                <a
                    href="#page-3"
                    class="page-link page-link--current"
                    data-page="3"
                    aria-current="page">
                    3
                </a>
                <a href="#page-4" class="page-link" data-page="4">4</a>
                <a href="#page-5" class="page-link" data-page="5">5</a>
                <a href="#page-6" class="page-link" data-page="6">6</a>
                <span class="dots" aria-hidden="true">&hellip;</span>
                <a href="#page-23" class="page-link" data-page="23">23</a>

                <button type="button" class="btn" id="next-page" aria-label="Next page">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="btn-icon"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                        aria-hidden="true">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </button>
            </nav>
        </main>
    </body>
</html>
