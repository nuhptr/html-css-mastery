<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Responsive Data Table Component</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <nav class="back-bar" aria-label="Breadcrumb">
            <a href="../../index.html">&larr; Back to Curriculum Hub</a>
        </nav>

        <main class="page">
            <div class="table-card" tabindex="0" role="region" aria-labelledby="table-caption">
                <table>
                    <caption id="table-caption">Chair Dimension &amp; Weight Comparison</caption>
                    <thead>
                        <tr>
                            <th scope="col">Specification</th>
                            <th scope="col">The Laid Back</th>
                            <th scope="col">The Worker Bee</th>
                            <th scope="col">The Chair 4/2</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <th scope="row">Width</th>
                            <td>80 cm</td>
                            <td>60 cm</td>
                            <td>220 cm</td>
                        </tr>
                        <tr>
                            <th scope="row">Height</th>
                            <td>100 cm</td>
                            <td>110 cm</td>
                            <td>90 cm</td>
                        </tr>
                        <tr>
                            <th scope="row">Depth</th>
                            <td>70 cm</td>
                            <td>65 cm</td>
                            <td>80 cm</td>
                        </tr>
                        <tr>
                            <th scope="row">Weight</th>
                            <td>16 kg</td>
                            <td>22 kg</td>
                            <td>80 kg</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </body>
</html>
