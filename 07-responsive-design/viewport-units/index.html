        <title>Dynamic Viewport Units (dvh, dvw)</title>

        <header class="hero">
            <h1>
                Dynamic Viewport Units (
                <code>100dvh</code>
                )
            </h1>
            <p>
                Use
                <code>dvh</code>
                instead of
                <code>vh</code>
                for full-screen mobile sections so mobile browser address bars do not cut off bottom
                content, and avoid
                <code>100vw</code>
                to prevent horizontal scrollbar overflow.
            </p>
            <a href="#details" class="btn">Hover Stage to Preview Gradient</a>
        </header>
