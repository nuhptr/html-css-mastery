<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Responsive Slide-In Hamburger Menu</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
            integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="style.css" />
        <script src="./script.js" defer></script>
    </head>

    <body>
        <nav class="navbar" aria-label="Primary navigation">
            <div class="container navbar-flex">
                <a class="brand-link" href="../../index.html">
                    <img src="./logo.png" alt="Course logo" class="logo" width="44" height="44" />
                    <span>&larr; Hub</span>
                </a>

                <div class="main-menu">
                    <ul class="main-menu-list">
                        <li><a href="#home">Home</a></li>
                        <li><a href="#about">About</a></li>
                        <li><a href="#services">Services</a></li>
                        <li><a href="#blog">Blog</a></li>
                        <li><a href="#contact">Contact</a></li>
                    </ul>
                </div>

                <div class="mobile-menu">
                    <button
                        type="button"
                        class="mobile-menu-toggle"
                        aria-label="Toggle navigation menu"
                        aria-expanded="false"
                        aria-controls="mobile-menu-drawer">
                        <i class="fas fa-bars fa-lg" aria-hidden="true"></i>
                    </button>

                    <div class="mobile-menu-items" id="mobile-menu-drawer">
                        <ul class="mobile-menu-list">
                            <li><a href="#home">Home</a></li>
                            <li><a href="#about">About</a></li>
                            <li><a href="#services">Services</a></li>
                            <li><a href="#blog">Blog</a></li>
                            <li><a href="#contact">Contact</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <main class="content-preview">
            <h1>Responsive Slide-In Hamburger Menu</h1>
            <p>
                Shrink the viewport width below
                <code>768px</code>
                to test the accessible mobile drawer transition.
            </p>
        </main>
    </body>
</html>
