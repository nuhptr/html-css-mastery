<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign Up Form Styling</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <nav class="back-bar" aria-label="Breadcrumb">
            <a href="../../index.html">&larr; Back to Curriculum Hub</a>
        </nav>

        <main class="auth-shell">
            <section class="form-card" aria-labelledby="signup-heading">
                <h1 id="signup-heading">Sign Up</h1>
                <p class="subtitle">It's free and only takes a minute.</p>

                <form action="#">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first-name">First Name</label>
                            <input
                                type="text"
                                name="firstName"
                                id="first-name"
                                autocomplete="given-name"
                                placeholder="Jane"
                                required />
                        </div>
                        <div class="form-group">
                            <label for="last-name">Last Name</label>
                            <input
                                type="text"
                                name="lastName"
                                id="last-name"
                                autocomplete="family-name"
                                placeholder="Doe"
                                required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            name="email"
                            id="email"
                            autocomplete="email"
                            placeholder="jane@example.com"
                            required />
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            name="password"
                            id="password"
                            autocomplete="new-password"
                            minlength="8"
                            placeholder="Minimum 8 characters"
                            required />
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input
                            type="password"
                            name="password2"
                            id="confirm-password"
                            autocomplete="new-password"
                            minlength="8"
                            placeholder="Repeat password"
                            required />
                    </div>

                    <button type="submit" class="btn-submit">Create Account</button>

                    <p class="bottom-text">
                        By clicking Create Account, you agree to our
                        <a href="#terms">Terms &amp; Conditions</a>
                        and
                        <a href="#privacy">Privacy Policy</a>
                        .
                    </p>
                </form>
            </section>

            <footer class="auth-footer">
                <p>
                    Already have an account?
                    <a href="#login">Log in here</a>
                </p>
            </footer>
        </main>
    </body>
</html>
