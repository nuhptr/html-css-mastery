<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HTML Iframe, Embed, and Object</title>
        <link rel="stylesheet" href="../../styles/lesson-base.css" />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <nav class="lesson-topbar" aria-label="Breadcrumb">
            <a class="lesson-topbar__back" href="../../index.html">&larr; Back to Curriculum Hub</a>
            <span class="lesson-topbar__module">01 &middot; HTML Fundamentals</span>
        </nav>

        <main class="lesson-shell">
            <h1>Iframe &amp; Embedded Content</h1>

            <section class="lesson-card">
                <h2>Local Page Embed</h2>
                <iframe
                    class="embed-frame embed-frame--short"
                    title="Local test page preview"
                    src="./test.html"></iframe>
            </section>

            <section class="lesson-card">
                <h2>YouTube Video</h2>
                <iframe
                    class="embed-frame"
                    title="YouTube video tutorial"
                    src="https://www.youtube.com/embed/8sXRyHI3bLw"
                    loading="lazy"
                    allowfullscreen></iframe>
            </section>

            <section class="lesson-card">
                <h2>Google Maps</h2>
                <iframe
                    class="embed-frame"
                    title="Googleplex location map"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3152.0000000000005!2d-122.0841926846827!3d37.42240897982596!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808f7e3f0b0b8a3d%3A0x7f3f7e3f0b0b8a3d!2sGoogleplex!5e0!3m2!1sen!2sus!4v1605720000000!5m2!1sen!2sus"
                    loading="lazy"></iframe>
            </section>
        </main>
    </body>
</html>
